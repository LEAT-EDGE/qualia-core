[bench]
name = "GSC_CNN_MFCC_float32_train"
seed = 2
first_run = 1
last_run = 1

[learningframework]
kind = 'PyTorch'

[deploy]
target = 'Linux'
converter.kind = 'QualiaCodeGen'
quantize = ['float32']
optimize = ['']

[dataset]
kind = "GSC"
params.variant = "v2"
params.path = "data/speech_commands_v0.02/"
# params.subset = "no_background_noise"
params.subset = "digits"
params.train_valid_split = true

[[preprocessing]]
kind = "Class2BinMatrix"

[[preprocessing]]
kind = "Normalize"
params.method = 'z-score'
#params.method = 'min-max'
params.axis = 0
params.debug = true

[[data_augmentation]]
kind = "GaussianNoise"
params.sigma = 0.00175

[[data_augmentation]]
kind = "TimeWarping"
params.sigma = 0.0675

[[data_augmentation]]
kind = "TimeShifting"
params.alpha = 1.0

#[[data_augmentation]]
#kind = "Mixup"
#params.alpha = 0.5

[[data_augmentation]]
kind = "MFCC"
params.evaluate = true
params.sample_rate = 16000
params.n_mfcc = 10
params.log_mels = true
params.melkwargs.n_fft = 1024
params.melkwargs.n_mels = 40
params.melkwargs.win_length = 640
params.melkwargs.hop_length = 320
params.melkwargs.f_min = 20
params.melkwargs.f_max = 8000

# pad by hop_length to obtain expected 1 + floor( (n_samples - window_length) / hop_length) = 49 samples
# https://github.com/librosa/librosa/issues/595#issuecomment-313116650
params.melkwargs.pad = 320
params.melkwargs.center = false

[[postprocessing]]
kind = "FuseBatchNorm"
export = true

[model_template]
kind = "CNN"
epochs = 32
batch_size = 512
params.input_shape = [49, 10]

[model_template.optimizer]
kind = "Adam"
params.lr = 0.025
params.weight_decay = 5e-4

[model_template.optimizer.scheduler]
kind = "StepLR"
params.gamma = 0.2
params.step_size = 8

[[model]]
name = 'gsc_cnn_mfcc'
params.dims = 1
params.filters        = [12, 18, 30, 48, 78]
params.kernel_sizes   = [ 7,  3,  3,  3,   3,   3]
params.pool_sizes     = [ 0,  0,  0,  0,   0,   0]
params.strides        = [ 1,  2,  2,  2,   2,   2]
params.paddings       = [ 4,  1,  1,  1,   1,   1]
params.dropouts       = [ 0,  0,  0,  0,   0,   0]
params.fc_units       = []
params.batch_norm = true
disabled = false
