[bench]
name = "CIFAR10_ResNetv1_float32_train"
seed = 1
first_run = 1
last_run = 1

[learningframework]
kind = 'PyTorch'

[deploy]
target = 'Linux'
converter.kind = 'QualiaCodeGen'
quantize = ['float32']
optimize = ['']
compress = [1]
#limit = 50

[dataset]
kind = "CIFAR10"
params.path = "data/cifar-10-batches-py/"
params.dtype = "uint8" # Keep uint8 dtype instead of converting to float32 for AutoAugment

[[preprocessing]]
kind = "Class2BinMatrix"
params.classes = 10

[[data_augmentation]]
kind = "AutoAugment"
params.policy = "CIFAR10"
params.before = false
params.after = true
#params.before = true
#params.after = false

# Convert to Float32 and scale by 255 after AutoAugment
[[data_augmentation]]
kind = "IntToFloat32"
params.scale = true
params.before = false
params.after = true
params.evaluate = true

[[data_augmentation]]
kind = "HorizontalFlip"
params.before = false
params.after = true

[[data_augmentation]]
kind = "Crop"
params.size = [32, 32]
params.padding = [4, 4]
params.before = false
params.after = true

#[[data_augmentation]]
#kind = "GaussianNoise"
#params.sigma = 0.005

#[[data_augmentation]]
#kind = "Rotation2D"
#params.angle = [-5, 5]

#[[data_augmentation]]
#kind = "ResizedCrop"
#params.size = [32, 32]
#params.scale = [0.85, 1.05]
#params.ratio = [0.9, 1.1]

# [[data_augmentation]]
# kind = "Mixup"
# params.before = false
# params.after = true

[[postprocessing]]
kind = "FuseBatchNorm"
export = true

[model_template]
kind = "ResNetStride"
epochs = 1
batch_size = 256
params.prepool 		= 1
params.strides		= [1, 2]
params.num_blocks	= [2]
params.dims		= 2

[model_template.optimizer]
#kind = "SGD"
kind = "Adam"
params.lr               = 0.01
#params.momentum		= 0.9
params.weight_decay	= 5e-4

[model_template.optimizer.scheduler]
kind = "MultiStepLR"
params.milestones	= [20, 40, 50]
params.gamma		= 0.1

[[model]]
name = "cifar10_resnetv1_8"
params.filters 		= [8, 8]
params.kernel_sizes 	= [3, 3]
params.pool_sizes   = [ 1,  1]
params.paddings		= [1, 1]
params.batch_norm 	= true
disabled = true

[[model]]
name = "cifar10_resnetv1_16"
params.filters 		= [16, 16]
params.kernel_sizes 	= [3, 3]
params.pool_sizes   = [ 1,  1]
params.paddings		= [1, 1]
